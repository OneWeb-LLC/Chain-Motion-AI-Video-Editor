app = 'frameforge-api-oweb'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  FRAMEFORGE_SATELLITE = '1'
  FRAMEFORGE_DATA_ROOT = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = 'frameforge_data'
  destination = '/data'
